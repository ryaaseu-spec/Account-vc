name: Discord Voice Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Clean old files
        run: |
          rm -f package-lock.json
          rm -rf node_modules

      - name: Install Discord Selfbot directly
        run: npm install discord.js-selfbot-v13 --force

      - name: Run Bot
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: node index.js
